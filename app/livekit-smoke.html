<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team-D LiveKit browser participant</title>
    <style>
      :root {
        color: #f7f7f7;
        background: #111318;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        color: #111318;
        background: #59f2c2;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      pre {
        min-height: 280px;
        overflow: auto;
        padding: 16px;
        border: 1px solid #343844;
        border-radius: 12px;
        background: #08090c;
        white-space: pre-wrap;
      }

      code {
        color: #59f2c2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LiveKit browser participant smoke test</h1>
      <p>
        <code>.env.local</code> の短命tokenで接続し、browserとAgentのidentityを画面とConsoleへ記録します。
        token自体は表示・記録しません。
      </p>
      <button id="connect" type="button">Roomへ接続</button>
      <p id="summary" aria-live="polite"></p>
      <pre id="log" aria-label="LiveKit接続ログ"></pre>
    </main>
    <script type="module" src="/src/livekit-smoke.ts"></script>
  </body>
</html>
