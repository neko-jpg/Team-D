[project]
name = "team-d-listing-photo-assistant-backend"
version = "0.1.0"
description = "FastAPI and LiveKit Agent backend for Team-D"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.116.1",
  "livekit==1.1.15",
  "livekit-agents==1.7.1",
  "livekit-api==1.2.1",
  "openai[realtime]==2.54.0",
  "pillow==12.3.0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[tool.uv]
package = false
required-version = ">=0.12.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
